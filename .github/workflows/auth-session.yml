name: Node session authentication
on:
  pull_request:
  push:
    branches: [main]
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run test:auth -- --output "${{ runner.temp }}/auth-test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-session-results
          path: ${{ runner.temp }}/auth-test-results
